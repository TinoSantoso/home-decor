name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Default to read-only token; escalate per-job when needed.
permissions: read-all

jobs:
  verify:
    name: Verify deps + typecheck + lint + test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Supply-chain verification
        run: bash scripts/verify-deps.sh

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test
