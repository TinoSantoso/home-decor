name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Default to read-only token; escalate per-job when needed.
permissions: read-all

jobs:
  verify:
    name: Verify deps + typecheck + lint + test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Supply-chain verification
        run: bash scripts/verify-deps.sh

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Install Playwright browsers
        # `--with-deps` installs the apt packages chromium needs on ubuntu.
        # ignore-scripts is still enforced for npm; playwright manages its own
        # browser binaries outside npm and verifies them against its lockfile.
        run: npx playwright install --with-deps chromium

      - name: E2E (Playwright)
        run: npm run test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
